      </div>
    </div>
  </div>
  <script>

      function updateUI(){ui.lvl.textContent=planetLevel;ui.kills.textContent=p.kills;ui.dmg.textContent=p.damage;ui.ammo.textContent=p.reloading?'RELOADING':p.ammo+' / '+p.maxAmmo;ui.hpText.textContent=Math.ceil(p.hp)+' / '+p.maxHp;ui.hpBar.style.width=(p.hp/p.maxHp*100)+'%';ui.xpText.textContent=p.xp+' / '+p.xpNeed;ui.xpBar.style.width=(p.xp/p.xpNeed*100)+'%';let cq=bossSpawned?90:Math.min(85,Math.round((7-Math.min(7,enemies.filter(e=>!e.boss).length))/7*85));if(won)cq=100;ui.conqText.textContent=cq+'%';ui.conqBar.style.width=cq+'%';root.querySelector('.title').textContent='PLANET CONQUEROR — '+(planetLevel===1?'TERRA':planetLevel===2?'VIOLET':'EMBER');root.querySelector('.row span').textContent='Health';root.querySelectorAll('.row span')[4].textContent=(planetLevel===1?'Terra':planetLevel===2?'Violet':'Ember')+' Conquest';ui.bossStatus.innerHTML=bossSpawned?(won?'<span class="boss">Overlord defeated</span>':'<span class="boss">'+(planetLevel===1?'TERRA':planetLevel===2?'VIOLET':'EMBER')+' OVERLORD ACTIVE</span>'):'Overlord dormant — defeat all enemies'}

    })();
